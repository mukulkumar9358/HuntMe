name: CI

# Render's `autoDeployTrigger: checksPass` waits for these checks on `main` before deploying.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (lint, tests, migrations)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: huntme
          POSTGRES_PASSWORD: huntme_dev_pw
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U huntme -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      # CI-only throwaway credentials for the service containers above; not secrets.
      TEST_DATABASE_URL: postgresql+asyncpg://huntme:huntme_dev_pw@localhost:5432/huntme_test
      TEST_REDIS_URL: redis://localhost:6379/1
      DATABASE_URL: postgresql+asyncpg://huntme:huntme_dev_pw@localhost:5432/huntme_test
      REDIS_URL: redis://localhost:6379/1
      JWT_SECRET: ci-only-secret-ci-only-secret-0123456789
      APP_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt
          pip install ruff

      - name: Create clean test database
        run: createdb --host localhost --username huntme huntme_test
        env:
    PGPASSWORD: huntme_dev_pw
      - name: Lint (syntax errors and undefined names)
        run: ruff check --select E9,F63,F7,F82 .
      - name: Tests (builds the schema from the real Alembic migrations)
        run: pytest -q
      - name: Migrations are in sync with the models
        run: |
          alembic upgrade head
          alembic check

  frontend:
    name: Frontend (lint, typecheck, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Production build
        run: npm run build
        env:
          BACKEND_INTERNAL_URL: https://huntme-backend.onrender.com
          NEXT_PUBLIC_WS_URL: wss://huntme-backend.onrender.com
